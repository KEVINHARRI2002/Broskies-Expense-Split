<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broskies' Split — an expense ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1E4;
    --paper-dark: #EDE5D0;
    --ink: #24312B;
    --ink-soft: #5B6A61;
    --green: #2F6F4F;
    --green-deep: #1E4A35;
    --rust: #B0402E;
    --rule: #CFC3A3;
    --white: #FFFDF8;
    --radius: 2px;
  }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  html{ overflow-x:hidden; }
  body{
    margin:0;
    background: var(--paper-dark);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(16px, 5vw, 40px) clamp(10px, 4vw, 16px) clamp(40px, 8vw, 80px);
    overflow-x:hidden;
  }
  .receipt{
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 var(--white) inset, 0 18px 40px -20px rgba(30,40,35,0.35);
    position: relative;
  }

  header.masthead{
    padding: clamp(22px, 6vw, 34px) clamp(18px, 6vw, 32px) clamp(16px, 4vw, 22px);
    text-align:center;
    border-bottom: 1px dashed var(--rule);
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green-deep);
    margin: 0 0 8px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(26px, 7vw, 34px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .masthead p.sub{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 8px 0 0;
  }
  .masthead-reset{
    margin-top: 10px;
  }
  .masthead-reset button{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px;
  }
  .masthead-reset button:hover{ color: var(--rust); }

  .stage{ padding: clamp(20px, 6vw, 28px) clamp(18px, 6vw, 32px) clamp(24px, 6vw, 32px); }
  .step-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .step-label b{ color: var(--rust); font-weight:600; }

  label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .hint{ font-size:12px; color: var(--ink-soft); margin: 6px 0 0; }

  input[type=text], input[type=number], select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    border: 1px solid var(--rule);
    background: var(--white);
    border-radius: var(--radius);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select{ appearance:none; -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  select:invalid{ color: var(--ink-soft); }
  input:focus-visible{
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47,111,79,0.15);
  }

  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--green-deep);
    background: var(--green);
    color: var(--white);
    cursor:pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .btn:hover{ background: var(--green-deep); }
  .btn:active{ transform: translateY(1px); }
  .btn:focus-visible{ outline: 2px solid var(--rust); outline-offset: 2px; }
  .btn.ghost{
    background: transparent;
    color: var(--green-deep);
    border: 1px solid var(--rule);
  }
  .btn.ghost:hover{ background: var(--paper-dark); }
  .btn.text{
    background:none; border:none; color: var(--rust); padding: 4px 0;
    font-size: 12px; text-decoration: underline; text-underline-offset:3px;
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn[data-full]{ width:100%; }
  .export-row{ margin-top: 20px; }

  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }

  .choice-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .choice{
    text-align:left;
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .choice:hover{ border-color: var(--green); }
  .choice h3{
    font-family:'Fraunces', serif; font-size:17px; margin:0 0 4px; font-weight:600;
  }
  .choice p{ font-size:12.5px; color: var(--ink-soft); margin:0; line-height:1.4; }

  .people-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 5px 10px;
    background: var(--paper-dark);
    border: 1px solid var(--rule);
    border-radius: 100px;
  }

  fieldset{ border:none; padding:0; margin: 12px 0 0; }
  legend{ font-size: 13px; font-weight:600; margin-bottom:8px; padding:0; }
  .participant-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check{
    display:flex; align-items:center; gap:8px;
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 9px 10px;
    font-size: 13.5px;
    cursor:pointer;
  }
  .check input{ accent-color: var(--green); width:15px; height:15px; }
  .check.all-toggle{ background: var(--paper-dark); font-weight:600; }

  .item-list{ margin-top: 22px; }
  .item-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap: wrap;
    padding: 12px 0;
    border-bottom: 1px dashed var(--rule);
    gap: 10px;
  }
  .item-row .name{ font-weight:600; font-size:14px; }
  .item-row .split-note{ font-size:11.5px; color: var(--ink-soft); margin-top:3px; }
  .item-row .amt{ font-family:'IBM Plex Mono', monospace; font-size:14px; white-space:nowrap; }
  .item-row .remove{
    background:none; border:none; color: var(--rust); cursor:pointer;
    font-size: 11px; font-family:'IBM Plex Mono', monospace; padding: 0; margin-top:4px;
  }

  .totals-strip{
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--ink);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .totals-strip .label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .totals-strip .value{ font-family:'IBM Plex Mono', monospace; font-size: 20px; font-weight:600; }
  .totals-strip .value.warn{ color: var(--rust); }

  .empty{
    text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size:13px;
  }

  .breakdown-list{ margin-top: 18px; }
  .person-card{
    padding: 16px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .person-card:last-child{ border-bottom:none; }
  .person-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .person-head .pname{ font-family:'Fraunces', serif; font-weight:600; font-size: 18px; }
  .person-head .pamt{ font-family:'IBM Plex Mono', monospace; font-size: 18px; }
  .person-head .pamt.positive{ color: var(--green-deep); }
  .person-head .pamt.negative{ color: var(--rust); }
  .person-sub{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .person-lines{ margin-top: 6px; }
  .person-lines .line{
    display:flex; justify-content:space-between;
    font-size: 12.5px; color: var(--ink-soft); padding: 2px 0;
  }

  .settle-section{ margin-top: 26px; }
  .settle-list{ margin-top: 10px; }
  .settle-row{
    display:flex; align-items:center; gap: 10px;
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13.5px;
    flex-wrap: wrap;
  }
  .settle-row .who{ font-weight:600; }
  .settle-row .arrow{ color: var(--ink-soft); }
  .settle-row .amt{
    margin-left: auto;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color: var(--rust);
  }
  .settle-empty{
    text-align:center; padding: 16px 10px; color: var(--ink-soft); font-size:13px;
    background: var(--white); border: 1px dashed var(--rule); border-radius: var(--radius);
  }

  .stamp{
    position: absolute;
    top: 26px; right: 30px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--rust);
    border: 1.5px solid var(--rust);
    border-radius: 4px;
    padding: 4px 9px;
    transform: rotate(6deg);
    opacity: .85;
    pointer-events:none;
  }

  .foot-actions{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 26px;
  }
  .foot-actions .btn{ flex: 1 1 auto; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (max-width: 640px){
    .choice-grid{ grid-template-columns: 1fr; }
  }

  @media (max-width: 480px){
    .participant-grid{ grid-template-columns: 1fr; }
    .stamp{ top: 18px; right: 16px; font-size: 10px; padding: 3px 7px; }
    .person-head .pname, .person-head .pamt{ font-size: 16px; }
  }

  @media (max-width: 360px){
    .foot-actions{ flex-direction: column; align-items: stretch; }
    .foot-actions span{ display:none; }
  }

  @media (min-width: 900px){
    .receipt{ max-width: 600px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<main class="receipt" id="receipt">
  <header class="masthead">
    <p class="eyebrow">No. 001 · Shared Ledger</p>
    <h1>Broskies Split</h1>
    <p class="sub">Even shares, honestly kept.</p>
    <div id="masthead-status"></div>
  </header>

  <div class="stage" id="stage"><!-- rendered by JS --></div>
</main>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "split-expenses-session";
  const EXPIRY_MS = 24 * 60 * 60 * 1000; // 1 day

  const state = {
    step: "names",       // names -> mode -> equal-total | items -> breakdown
    people: [],
    mode: null,           // 'equal' | 'items'
    equalTotal: null,
    equalPaidBy: null,
    items: []             // {id, name, cost, paidBy, participants: [names]}
  };

  function saveSession(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ savedAt: Date.now(), state }));
    } catch(e){ /* storage unavailable — fail silently, session just won't persist */ }
  }

  function clearSession(){
    try{ localStorage.removeItem(STORAGE_KEY); } catch(e){}
  }

  function loadSession(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      if(!parsed || typeof parsed.savedAt !== "number") return false;
      if(Date.now() - parsed.savedAt > EXPIRY_MS){
        clearSession();
        return false;
      }
      Object.assign(state, parsed.state);
      return state.people && state.people.length > 0;
    } catch(e){ return false; }
  }

  const stage = document.getElementById("stage");
  const money = n => (Math.round(n * 100) / 100).toFixed(2);
  const uid = () => Math.random().toString(36).slice(2, 9);

  function render(){
    stage.innerHTML = "";
    saveSession();
    renderMastheadStatus();
    if(state.step === "names") return renderNames();
    if(state.step === "mode") return renderMode();
    if(state.step === "equal-total") return renderEqualTotal();
    if(state.step === "items") return renderItems();
    if(state.step === "breakdown") return renderBreakdown();
  }

  function renderMastheadStatus(){
    const el = document.getElementById("masthead-status");
    if(!el) return;
    if(state.people.length > 0 && state.step !== "names"){
      el.innerHTML = `<p class="masthead-reset"><button type="button" id="masthead-reset-btn">Start fresh</button></p>`;
      document.getElementById("masthead-reset-btn").addEventListener("click", () => {
        if(!confirm("Start a new split? This clears the current one.")) return;
        state.people = []; state.mode = null; state.equalTotal = null; state.equalPaidBy = null; state.items = [];
        state.step = "names";
        clearSession();
        render();
      });
    } else {
      el.innerHTML = "";
    }
  }

  // ---------- Step: names ----------
  function renderNames(){
    stage.insertAdjacentHTML("beforeend", `
      <p class="step-label"><b>Step 1</b> · Who's splitting?</p>
      <label for="names-input">Names</label>
      <input type="text" id="names-input" placeholder="e.g. Karthik, Divya, Arjun, Meera" autocomplete="off">
      <p class="hint">Separate each name with a comma. At least two people needed.</p>
      <div id="names-preview" class="people-tags"></div>
      <div class="foot-actions">
        <span></span>
        <button class="btn" id="names-next">Continue</button>
      </div>
    `);
    const input = document.getElementById("names-input");
    const preview = document.getElementById("names-preview");
    const nextBtn = document.getElementById("names-next");

    function parseNames(){
      return input.value.split(",").map(s => s.trim()).filter(Boolean);
    }
    function updatePreview(){
      const names = parseNames();
      preview.innerHTML = names.map(n => `<span class="tag">${escapeHtml(n)}</span>`).join("");
      nextBtn.disabled = names.length < 2;
    }
    input.addEventListener("input", updatePreview);
    input.value = state.people.join(", ");
    updatePreview();
    input.focus();

    nextBtn.addEventListener("click", () => {
      const names = parseNames();
      if(names.length < 2) return;
      // de-duplicate, keep order
      state.people = [...new Set(names)];
      state.step = "mode";
      render();
    });
    input.addEventListener("keydown", e => {
      if(e.key === "Enter" && !nextBtn.disabled) nextBtn.click();
    });
  }

  // ---------- Step: mode ----------
  function renderMode(){
    stage.insertAdjacentHTML("beforeend", `
      <p class="step-label"><b>Step 2</b> · How do you want to split?</p>
      <div class="choice-grid">
        <button class="choice" id="choice-equal">
          <h3>Split a total, now</h3>
          <p>One amount, divided evenly across everyone. Good for a quick, single bill.</p>
        </button>
        <button class="choice" id="choice-items">
          <h3>Add items</h3>
          <p>Log each purchase with its own cost and who shares it. Good for a running tab.</p>
        </button>
      </div>
      <div class="foot-actions">
        <button class="btn ghost" id="mode-back">Back</button>
        <span></span>
      </div>
    `);
    document.getElementById("mode-back").addEventListener("click", () => {
      state.step = "names"; render();
    });
    document.getElementById("choice-equal").addEventListener("click", () => {
      state.mode = "equal"; state.step = "equal-total"; render();
    });
    document.getElementById("choice-items").addEventListener("click", () => {
      state.mode = "items"; state.step = "items"; render();
    });
  }

  // ---------- Step: equal total ----------
  function renderEqualTotal(){
    stage.insertAdjacentHTML("beforeend", `
      <p class="step-label"><b>Step 3</b> · Total amount spent</p>
      <label for="total-input">Amount</label>
      <input type="number" id="total-input" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
      <div style="margin-top:12px;">
        <label for="equal-paidby">Who paid?</label>
        <select id="equal-paidby">
          <option value="" disabled ${!state.equalPaidBy ? "selected" : ""}>Select person</option>
          ${state.people.map(p => `<option value="${escapeHtml(p)}" ${state.equalPaidBy === p ? "selected" : ""}>${escapeHtml(p)}</option>`).join("")}
        </select>
      </div>
      <p class="hint">Split evenly across ${state.people.length} people: ${state.people.join(", ")}.</p>
      <div class="foot-actions">
        <button class="btn ghost" id="equal-back">Back</button>
        <button class="btn" id="equal-next" disabled>See breakdown</button>
      </div>
    `);
    const input = document.getElementById("total-input");
    const paidBySelect = document.getElementById("equal-paidby");
    const nextBtn = document.getElementById("equal-next");
    if(state.equalTotal) input.value = state.equalTotal;

    function validate(){
      nextBtn.disabled = !(parseFloat(input.value) > 0 && paidBySelect.value !== "");
    }
    input.addEventListener("input", validate);
    paidBySelect.addEventListener("change", validate);
    validate();
    input.focus();
    document.getElementById("equal-back").addEventListener("click", () => {
      state.step = "mode"; render();
    });
    nextBtn.addEventListener("click", () => {
      state.equalTotal = parseFloat(input.value);
      state.equalPaidBy = paidBySelect.value;
      state.step = "breakdown";
      render();
    });
    input.addEventListener("keydown", e => {
      if(e.key === "Enter" && !nextBtn.disabled) nextBtn.click();
    });
  }

  // ---------- Step: items ----------
  function renderItems(){
    stage.innerHTML = "";
    const total = state.items.reduce((s, it) => s + it.cost, 0);
    stage.insertAdjacentHTML("beforeend", `
      <p class="step-label"><b>Step 3</b> · Add items</p>
      <label for="item-name">Item</label>
      <input type="text" id="item-name" placeholder="e.g. Dinner, Cab, Groceries" autocomplete="off">
      <div class="row" style="margin-top:12px;">
        <div>
          <label for="item-cost">Cost</label>
          <input type="number" id="item-cost" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
        </div>
        <div>
          <label for="item-paidby">Paid by</label>
          <select id="item-paidby">
            <option value="" disabled selected>Select owner</option>
            ${state.people.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("")}
          </select>
        </div>
      </div>
      <fieldset>
        <legend>Split between</legend>
        <div class="participant-grid" id="participant-grid"></div>
      </fieldset>
      <div class="foot-actions">
        <span></span>
        <button class="btn" id="add-item" disabled>Add item</button>
      </div>

      <div class="item-list" id="item-list"></div>

      <div class="totals-strip">
        <span class="label">Running total</span>
        <span class="value" id="running-total">₹${money(total)}</span>
      </div>

      <div class="foot-actions">
        <button class="btn ghost" id="items-back">Back</button>
        <button class="btn" id="items-done" ${state.items.length ? "" : "disabled"}>See breakdown</button>
      </div>
    `);

    const grid = document.getElementById("participant-grid");
    grid.innerHTML = `
      <label class="check all-toggle">
        <input type="checkbox" id="check-all"> Everyone
      </label>
      ${state.people.map(p => `
        <label class="check">
          <input type="checkbox" class="participant-check" value="${escapeHtml(p)}" checked>
          ${escapeHtml(p)}
        </label>
      `).join("")}
    `;
    const checkAll = document.getElementById("check-all");
    const checks = () => Array.from(document.querySelectorAll(".participant-check"));
    function syncAllToggle(){
      checkAll.checked = checks().every(c => c.checked);
    }
    checkAll.addEventListener("change", () => {
      checks().forEach(c => c.checked = checkAll.checked);
      validate();
    });
    checks().forEach(c => c.addEventListener("change", () => { syncAllToggle(); validate(); }));
    syncAllToggle();

    const nameInput = document.getElementById("item-name");
    const costInput = document.getElementById("item-cost");
    const paidBySelect = document.getElementById("item-paidby");
    const addBtn = document.getElementById("add-item");

    function validate(){
      const hasName = nameInput.value.trim().length > 0;
      const hasCost = parseFloat(costInput.value) > 0;
      const hasOwner = paidBySelect.value !== "";
      const hasParticipants = checks().some(c => c.checked);
      addBtn.disabled = !(hasName && hasCost && hasOwner && hasParticipants);
    }
    nameInput.addEventListener("input", validate);
    costInput.addEventListener("input", validate);
    paidBySelect.addEventListener("change", validate);
    validate();
    nameInput.focus();

    addBtn.addEventListener("click", () => {
      const participants = checks().filter(c => c.checked).map(c => c.value);
      state.items.push({
        id: uid(),
        name: nameInput.value.trim(),
        cost: parseFloat(costInput.value),
        paidBy: paidBySelect.value,
        participants
      });
      saveSession();
      renderItems(); // re-render fresh, cheap and keeps state consistent
      stage.querySelectorAll("#item-name")[0].focus();
    });

    renderItemList();

    document.getElementById("items-back").addEventListener("click", () => {
      state.step = "mode"; render();
    });
    document.getElementById("items-done").addEventListener("click", () => {
      if(!state.items.length) return;
      state.step = "breakdown"; render();
    });
  }

  function renderItemList(){
    const list = document.getElementById("item-list");
    if(!state.items.length){
      list.innerHTML = `<p class="empty">No items yet — add your first purchase above.</p>`;
      return;
    }
    list.innerHTML = state.items.map(it => `
      <div class="item-row">
        <div>
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="split-note">paid by ${escapeHtml(it.paidBy)} — split ${it.participants.length} way${it.participants.length === 1 ? "" : "s"} — ${it.participants.map(escapeHtml).join(", ")}</div>
        </div>
        <div style="text-align:right;">
          <div class="amt">₹${money(it.cost)}</div>
          <button class="remove" data-id="${it.id}">remove</button>
        </div>
      </div>
    `).join("");
    list.querySelectorAll(".remove").forEach(btn => {
      btn.addEventListener("click", () => {
        state.items = state.items.filter(it => it.id !== btn.dataset.id);
        saveSession();
        renderItems();
      });
    });
  }

  // ---------- Shared: compute breakdown ----------
  function computeBreakdown(){
    let perPerson = {};
    let paid = {};
    state.people.forEach(p => { perPerson[p] = { total: 0, lines: [] }; paid[p] = 0; });
    let grandTotal = 0;

    if(state.mode === "equal"){
      grandTotal = state.equalTotal;
      const share = grandTotal / state.people.length;
      state.people.forEach(p => {
        perPerson[p].total = share;
        perPerson[p].lines.push({ label: "Equal share of total", amt: share });
      });
      if(state.equalPaidBy) paid[state.equalPaidBy] = grandTotal;
    } else {
      state.items.forEach(it => {
        grandTotal += it.cost;
        const share = it.cost / it.participants.length;
        it.participants.forEach(p => {
          perPerson[p].total += share;
          perPerson[p].lines.push({ label: it.name, amt: share });
        });
        if(it.paidBy) paid[it.paidBy] = (paid[it.paidBy] || 0) + it.cost;
      });
    }

    const netBalance = {};
    state.people.forEach(p => { netBalance[p] = paid[p] - perPerson[p].total; });

    const settlements = computeSettlements(netBalance);

    return { perPerson, grandTotal, paid, netBalance, settlements };
  }

  function computeSettlements(netBalance){
    const eps = 0.005;
    const creditors = [];
    const debtors = [];
    Object.keys(netBalance).forEach(p => {
      const v = netBalance[p];
      if(v > eps) creditors.push({ p, amt: v });
      else if(v < -eps) debtors.push({ p, amt: -v });
    });
    creditors.sort((a, b) => b.amt - a.amt);
    debtors.sort((a, b) => b.amt - a.amt);

    const settlements = [];
    let i = 0, j = 0;
    while(i < debtors.length && j < creditors.length){
      const pay = Math.min(debtors[i].amt, creditors[j].amt);
      if(pay > eps) settlements.push({ from: debtors[i].p, to: creditors[j].p, amount: pay });
      debtors[i].amt -= pay;
      creditors[j].amt -= pay;
      if(debtors[i].amt <= eps) i++;
      if(creditors[j].amt <= eps) j++;
    }
    return settlements;
  }

  // ---------- Step: breakdown ----------
  function renderBreakdown(){
    const { perPerson, grandTotal, paid, netBalance, settlements } = computeBreakdown();

    stage.insertAdjacentHTML("beforeend", `
      <p class="step-label"><b>Breakdown</b> · Who owes what</p>
      <div class="breakdown-list">
        ${state.people.map(p => {
          const net = netBalance[p];
          const cls = net > 0.005 ? "positive" : net < -0.005 ? "negative" : "";
          const netLabel = net > 0.005 ? `is owed ₹${money(net)}` : net < -0.005 ? `owes ₹${money(-net)}` : "settled up";
          return `
          <div class="person-card">
            <div class="person-head">
              <span class="pname">${escapeHtml(p)}</span>
              <span class="pamt ${cls}">${netLabel}</span>
            </div>
            <div class="person-sub">Paid ₹${money(paid[p])} · Share ₹${money(perPerson[p].total)}</div>
            <div class="person-lines">
              ${perPerson[p].lines.map(l => `
                <div class="line"><span>${escapeHtml(l.label)}</span><span>₹${money(l.amt)}</span></div>
              `).join("")}
            </div>
          </div>
        `;}).join("")}
      </div>
      <div class="totals-strip">
        <span class="label">Total spent</span>
        <span class="value">₹${money(grandTotal)}</span>
      </div>

      <div class="settle-section">
        <p class="step-label"><b>Settle up</b> · Fewest payments to clear it</p>
        <div class="settle-list">
          ${settlements.length ? settlements.map(s => `
            <div class="settle-row">
              <span class="who">${escapeHtml(s.from)}</span>
              <span class="arrow">owes</span>
              <span class="who">${escapeHtml(s.to)}</span>
              <span class="amt">₹${money(s.amount)}</span>
            </div>
          `).join("") : `<div class="settle-empty">Everyone's already settled up.</div>`}
        </div>
      </div>

      <div class="export-row">
        <button class="btn" id="export-jpeg" data-full>Export as JPEG</button>
      </div>

      <div class="foot-actions">
        <button class="btn ghost" id="breakdown-back">${state.mode === "items" ? "Add more items" : "Edit total"}</button>
        <button class="btn ghost" id="start-over">Start a new split</button>
      </div>
    `);

    document.getElementById("breakdown-back").addEventListener("click", () => {
      state.step = state.mode === "items" ? "items" : "equal-total";
      render();
    });
    document.getElementById("start-over").addEventListener("click", () => {
      state.people = []; state.mode = null; state.equalTotal = null; state.equalPaidBy = null; state.items = [];
      state.step = "names";
      clearSession();
      render();
    });
    document.getElementById("export-jpeg").addEventListener("click", exportBreakdownImage);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  // ---------- Export breakdown as JPEG ----------
  async function exportBreakdownImage(){
    const btn = document.getElementById("export-jpeg");
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparing image…";

    try{
      if(document.fonts && document.fonts.ready) await document.fonts.ready;

      const { perPerson, grandTotal, paid, netBalance, settlements } = computeBreakdown();
      const scale = 2;               // draw at 2x for a crisp export
      const width = 640;
      const padX = 44;
      let y = 0;

      // First pass on a throwaway canvas to measure total height
      const lineHeight = 20;
      const personGap = 14;
      let contentHeight = 0;
      state.people.forEach(p => {
        contentHeight += 46 + perPerson[p].lines.length * lineHeight + personGap;
      });

      const settleHeight = 40 + (settlements.length ? settlements.length * 34 : 26);

      const headerHeight = 150;
      const footerHeight = 96;
      const height = headerHeight + contentHeight + settleHeight + footerHeight;

      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      const paper = "#F6F1E4";
      const ink = "#24312B";
      const inkSoft = "#5B6A61";
      const rule = "#CFC3A3";
      const green = "#1E4A35";

      // background
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, width, height);

      // header
      y = 40;
      ctx.fillStyle = green;
      ctx.font = "600 11px 'IBM Plex Mono', monospace";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("SPLIT · SHARED LEDGER", padX, y);

      y += 34;
      ctx.fillStyle = ink;
      ctx.font = "600 32px 'Fraunces', serif";
      ctx.fillText("Split breakdown", padX, y);

      y += 22;
      ctx.fillStyle = inkSoft;
      ctx.font = "400 12px 'Inter', sans-serif";
      const dateStr = new Date().toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
      ctx.fillText(`${state.people.length} people · ${dateStr}`, padX, y);

      y += 22;
      dashedLine(ctx, padX, y, width - padX, rule);

      // per-person rows
      y += 26;
      state.people.forEach(p => {
        const net = netBalance[p];
        const netColor = net > 0.005 ? green : net < -0.005 ? "#B0402E" : inkSoft;
        const netLabel = net > 0.005 ? `is owed ₹${money(net)}` : net < -0.005 ? `owes ₹${money(-net)}` : "settled up";

        ctx.fillStyle = ink;
        ctx.font = "600 17px 'Fraunces', serif";
        ctx.fillText(p, padX, y);

        ctx.fillStyle = netColor;
        ctx.font = "600 13px 'IBM Plex Mono', monospace";
        ctx.textAlign = "right";
        ctx.fillText(netLabel, width - padX, y);
        ctx.textAlign = "left";

        y += 16;
        ctx.fillStyle = inkSoft;
        ctx.font = "400 11px 'Inter', sans-serif";
        ctx.fillText(`Paid ₹${money(paid[p])} · Share ₹${money(perPerson[p].total)}`, padX, y);

        perPerson[p].lines.forEach(l => {
          y += lineHeight;
          ctx.fillStyle = inkSoft;
          ctx.font = "400 12px 'Inter', sans-serif";
          ctx.fillText(l.label, padX + 4, y);
          ctx.font = "400 12px 'IBM Plex Mono', monospace";
          ctx.textAlign = "right";
          ctx.fillText(`₹${money(l.amt)}`, width - padX, y);
          ctx.textAlign = "left";
        });

        y += personGap + 10;
        dashedLine(ctx, padX, y - 6, width - padX, rule);
      });

      // total
      y += 18;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(padX, y);
      ctx.lineTo(width - padX, y);
      ctx.stroke();

      y += 26;
      ctx.fillStyle = inkSoft;
      ctx.font = "600 11px 'Inter', sans-serif";
      ctx.fillText("TOTAL SPENT", padX, y);
      ctx.fillStyle = ink;
      ctx.font = "600 22px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText(`₹${money(grandTotal)}`, width - padX, y);
      ctx.textAlign = "left";

      // settle up
      y += 32;
      ctx.fillStyle = green;
      ctx.font = "600 11px 'IBM Plex Mono', monospace";
      ctx.fillText("SETTLE UP", padX, y);

      if(settlements.length){
        settlements.forEach(s => {
          y += 30;
          ctx.fillStyle = ink;
          ctx.font = "600 14px 'Inter', sans-serif";
          ctx.fillText(`${s.from} owes ${s.to}`, padX, y);
          ctx.fillStyle = "#B0402E";
          ctx.font = "600 14px 'IBM Plex Mono', monospace";
          ctx.textAlign = "right";
          ctx.fillText(`₹${money(s.amount)}`, width - padX, y);
          ctx.textAlign = "left";
        });
      } else {
        y += 24;
        ctx.fillStyle = inkSoft;
        ctx.font = "400 12px 'Inter', sans-serif";
        ctx.fillText("Everyone's already settled up.", padX, y);
      }

      // footer
      ctx.fillStyle = inkSoft;
      ctx.font = "400 11px 'Inter', sans-serif";
      ctx.fillText("Made with Split", padX, height - 24);

      const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.94));
      const file = new File([blob], "split-breakdown.jpg", { type: "image/jpeg" });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({
          files: [file],
          title: "Split breakdown",
          text: "Broskies, Please find the split amount"
        });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "split-breakdown.jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
    } catch(err){
      if(err && err.name !== "AbortError"){
        alert("Couldn't export the image. Please try again.");
      }
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  function dashedLine(ctx, x1, y, x2, color){
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
    ctx.restore();
  }

  loadSession();
  render();
})();
</script>
</body>
